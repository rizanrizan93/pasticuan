# Copy these values into Streamlit Community Cloud:
# App settings -> Secrets. Never commit real keys to GitHub.

SCANNER_DATABASE_ENABLED = "true"
SCANNER_DATABASE_MODE = "SUPABASE_REST"
SCANNER_DATABASE_SCHEMA = "public"
SCANNER_DATABASE_TIMEOUT = "18"
SCANNER_DATABASE_CONNECT_TIMEOUT = "5"
SCANNER_DATABASE_READ_ATTEMPTS = "3"
SCANNER_DATABASE_RETRY_BACKOFF = "0.8"
SCANNER_DATABASE_MAX_ROWS = "2000"
SCANNER_DATABASE_CACHE_MAX_ROWS = "5000"

# v8 database-first read-through policy
SCANNER_DATABASE_READ_ENABLED = "true"
SCANNER_DATABASE_READ_BATCH_SIZE = "100"
SCANNER_DATABASE_FUNDAMENTAL_MAX_AGE_DAYS = "21"
SCANNER_DATABASE_HISTORY_MAX_AGE_DAYS = "30"
SCANNER_DATABASE_FORWARD_MAX_AGE_DAYS = "7"
SCANNER_DATABASE_STALE_MAX_AGE_DAYS = "180"

SUPABASE_URL = "https://YOUR_PROJECT_REF.supabase.co"
SUPABASE_SECRET_KEY = "sb_secret_REPLACE_WITH_BACKEND_SECRET_KEY"

# Legacy fallback only. Do not configure both unless migrating.
# SUPABASE_SERVICE_ROLE_KEY = "legacy_service_role_jwt"

# Safe dry-run before connecting Supabase:
# SCANNER_DATABASE_ENABLED = "true"
# SCANNER_DATABASE_MODE = "OUTBOX_ONLY"

# Optional runtime providers. These values are read at runtime and are not stored in scan_jobs.
ITICK_API_TOKEN = ""
TWELVE_DATA_API_KEY = ""

name: UI regression diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: UI and dashboard contracts
        continue-on-error: true
        run: pytest -q tests/test_institutional_dashboard_ui.py tests/test_future_fundamental_ui_patch.py tests/test_v9_8_17_dashboard_research_rank_integrity.py tests/test_top3_csv_download.py tests/test_runtime_release.py
      - name: Decision and execution contracts
        continue-on-error: true
        run: pytest -q tests/test_v9_8_8_execution_plan_integrity.py tests/test_v9_8_9_production_lane_integrity.py tests/test_v9_8_16_decision_priority_integrity.py
      - name: Phase 5.6 contracts
        continue-on-error: true
        run: pytest -q tests/test_phase5_6_*.py
      - name: Shared evidence contracts
        continue-on-error: true
        run: pytest -q tests/test_shared_*.py
      - name: Remaining contracts
        continue-on-error: true
        run: pytest -q --ignore=tests/test_evidence_governance.py --ignore=tests/test_official_evidence_bridge.py --ignore=tests/test_institutional_dashboard_ui.py --ignore=tests/test_future_fundamental_ui_patch.py --ignore=tests/test_v9_8_17_dashboard_research_rank_integrity.py --ignore=tests/test_top3_csv_download.py --ignore=tests/test_runtime_release.py --ignore=tests/test_v9_8_8_execution_plan_integrity.py --ignore=tests/test_v9_8_9_production_lane_integrity.py --ignore=tests/test_v9_8_16_decision_priority_integrity.py --ignore-glob='tests/test_phase5_6_*.py' --ignore-glob='tests/test_shared_*.py'

name: UI regression diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Full combined suite capture
        continue-on-error: true
        run: |
          pytest -q --ignore=tests/test_evidence_governance.py --ignore=tests/test_official_evidence_bridge.py --junitxml=/tmp/ui-regression.xml || true
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/ui-regression.xml').getroot()
          failed = []
          for case in root.iter('testcase'):
              child = case.find('failure') or case.find('error')
              if child is not None:
                  failed.append({
                      'classname': case.get('classname'),
                      'name': case.get('name'),
                      'message': child.get('message'),
                      'detail': (child.text or '')[-4000:],
                  })
          with open('/tmp/ui-failures.txt', 'w', encoding='utf-8') as handle:
              handle.write(repr(failed))
          print(failed)
          PY
      - name: Upload combined failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-evidence
          path: |
            /tmp/ui-regression.xml
            /tmp/ui-failures.txt

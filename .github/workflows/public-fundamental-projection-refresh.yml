name: Phase 5.6 public fundamental projection refresh - Pasticuan

on:
  push:
    branches: [main]
    paths:
      - "shared_public_fundamental_projection.py"
      - "shared_fundamental_runtime.py"
      - "tools/phase5_6_refresh_public_fundamental_projection.py"
      - "database/migration_v30_public_fundamental_projection.sql"
      - ".github/workflows/public-fundamental-projection-refresh.yml"
  workflow_dispatch:
  schedule:
    # 19:30 Asia/Jakarta on IDX weekdays.
    - cron: "30 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: phase5-6-public-fundamental-projection-refresh
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SHARED_EVIDENCE_SUPABASE_URL: ${{ secrets.SHARED_EVIDENCE_SUPABASE_URL }}
      SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.34.2
      - name: Compile projection path
        run: python -m py_compile shared_evidence_hub.py shared_fundamental_runtime.py shared_public_fundamental_projection.py tools/phase5_6_refresh_public_fundamental_projection.py
      - name: Refresh factual projection only
        run: python tools/phase5_6_refresh_public_fundamental_projection.py

name: Phase 5.6 capital action issued-history live producer - Pasticuan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capital-action-issued-history-live-validation.yml"
      - "tools/phase5_6_issued_history_live_validation.py"
      - "tests/test_phase5_6_issued_history_live_gate.py"
  workflow_dispatch:
    inputs:
      selected_ref:
        description: Exact commit SHA to validate
        required: false
        type: string
      observed_on:
        description: Evidence observation date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: phase5-6-capital-action-issued-history-live-validation
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  issued-history-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
      SHARED_EVIDENCE_SUPABASE_URL: ${{ secrets.SHARED_EVIDENCE_SUPABASE_URL }}
      SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.selected_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded issued-history validator dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.34.2

      - name: Run bounded issued-history producer proof
        run: |
          mkdir -p capital_action_issued_history_output
          set -o pipefail
          OBSERVED_ON="${{ inputs.observed_on }}"
          if [ -z "$OBSERVED_ON" ]; then
            OBSERVED_ON="$(TZ=Asia/Jakarta date +%F)"
          fi
          python tools/phase5_6_issued_history_live_validation.py \
            --mode producer \
            --client-id PASTICUAN \
            --feed issued-history \
            --observed-on "$OBSERVED_ON" \
            | tee capital_action_issued_history_output/summary.log

      - name: Record selected revision
        if: always()
        run: |
          mkdir -p capital_action_issued_history_output
          git rev-parse HEAD > capital_action_issued_history_output/selected-commit-sha.txt

      - name: Upload bounded proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-6-capital-action-issued-history-producer-proof
          path: capital_action_issued_history_output/
          if-no-files-found: error

name: Phase 5.6 market-time shape diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-time-shape-diagnostic.yml"
      - "tools/phase5_6_market_time_shape_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-6-market-time-shape-diagnostic
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  shape-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded diagnostic dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.34.2

      - name: Inspect shape only
        run: python tools/phase5_6_market_time_shape_diagnostic.py

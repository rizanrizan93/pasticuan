name: Emir hosted Streamlit health

on:
  push:
    branches: [codex/hosted-streamlit-smoke-20260813]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Emir health endpoint
        run: curl -fLsS --max-time 45 https://rizancuanmaksimal.streamlit.app/_stcore/health
      - name: Check Emir root page
        run: |
          curl -fLsS --max-time 45 -o /tmp/emir.html https://rizancuanmaksimal.streamlit.app/
          test -s /tmp/emir.html

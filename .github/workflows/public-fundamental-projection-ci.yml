name: Phase 5.6 public fundamental projection CI - Pasticuan

on:
  pull_request:
    branches: [main]
    paths:
      - "shared_public_fundamental_projection.py"
      - "shared_fundamental_runtime.py"
      - "tools/phase5_6_refresh_public_fundamental_projection.py"
      - "tools/phase5_6_structured_evidence_backfill.py"
      - "tests/test_phase5_6_public_fundamental_projection.py"
      - "database/migration_v30_public_fundamental_projection.sql"
      - "database/verify_v30_public_fundamental_projection.sql"
      - ".github/workflows/public-fundamental-projection-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.34.2 pytest==8.4.2
      - name: Compile projection path
        run: python -m py_compile shared_evidence_hub.py shared_fundamental_runtime.py shared_public_fundamental_projection.py tools/phase5_6_refresh_public_fundamental_projection.py tools/phase5_6_structured_evidence_backfill.py
      - name: Projection regression
        run: pytest -q tests/test_phase5_6_public_fundamental_projection.py

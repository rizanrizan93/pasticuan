name: Phase 5.6 public ownership projection refresh

on:
  push:
    branches: ["phase5.6/idx-direct-ownership-profile", "main"]
    paths:
      - "shared_public_ownership_projection.py"
      - "tools/phase5_6_refresh_public_ownership_projection.py"
      - "database/migration_v32_public_ownership_projection.sql"
      - "tests/test_phase5_6_public_ownership_projection.py"
      - ".github/workflows/public-ownership-projection-refresh.yml"
  workflow_dispatch:
  schedule:
    - cron: "40 12 * * 1-5"

permissions:
  contents: read

concurrency:
  group: phase5-6-public-ownership-projection
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHARED_EVIDENCE_SUPABASE_URL: ${{ secrets.SHARED_EVIDENCE_SUPABASE_URL }}
      SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'requests>=2.31,<3' 'pytest>=8,<9'
      - name: Compile projection path
        run: python -m py_compile shared_public_ownership_projection.py tools/phase5_6_refresh_public_ownership_projection.py
      - name: Projection regression
        run: pytest -q tests/test_phase5_6_public_ownership_projection.py
      - name: Refresh public ownership projection
        run: python tools/phase5_6_refresh_public_ownership_projection.py

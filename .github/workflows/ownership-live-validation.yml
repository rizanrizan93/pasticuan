name: Phase 5.6 ownership live producer - Pasticuan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ownership-live-validation.yml"
      - "tools/phase5_6_ownership_live_validation.py"
      - "shared_ownership_evidence.py"
      - "tests/test_phase5_6_ownership_live_gate.py"
      - "tests/test_shared_ownership_evidence.py"
  workflow_dispatch:
    inputs:
      selected_ref:
        description: Exact commit SHA to validate
        required: false
        type: string
      category:
        description: Ownership publication category
        required: false
        default: lima-persen
        type: choice
        options:
          - lima-persen
          - satu-persen
          - klasifikasi
          - tipe
      publication_date:
        description: Exact ZAPI ownership publication date (YYYY-MM-DD)
        required: false
        default: "2026-07-30"
        type: string

permissions:
  contents: read

concurrency:
  group: phase5-6-ownership-live-validation
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ownership-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
      SHARED_EVIDENCE_SUPABASE_URL: ${{ secrets.SHARED_EVIDENCE_SUPABASE_URL }}
      SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.selected_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bounded ownership validator dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==2.3.3 requests==2.34.2 openpyxl==3.1.5

      - name: Run bounded ownership producer proof
        run: |
          mkdir -p ownership_live_output
          set -o pipefail
          python tools/phase5_6_ownership_live_validation.py \
            --mode producer \
            --client-id PASTICUAN \
            --category "${{ inputs.category || 'lima-persen' }}" \
            --publication-date "${{ inputs.publication_date || '2026-07-30' }}" \
            | tee ownership_live_output/summary.log

      - name: Record selected revision
        if: always()
        run: |
          mkdir -p ownership_live_output
          git rev-parse HEAD > ownership_live_output/selected-commit-sha.txt

      - name: Upload bounded proof
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phase5-6-ownership-producer-proof
          path: ownership_live_output/
          if-no-files-found: error

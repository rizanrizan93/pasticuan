name: Super Streamlit smoke

on:
  push:
    branches: [main, codex/production-hardening-20260813, fix/super-persistence-contract-20260814]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime and test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Compile critical modules
        run: python -m py_compile app.py fast_scan_engine.py persistence_contract_patch.py resumable_app_engine.py scanner_database.py scanner.py evidence_enrichment.py simple_focus.py
      - name: Persistence and narrative coverage regressions
        run: pytest -q tests/test_v9_8_10_persistence_contract.py tests/test_narrative_coverage_precedence.py
      - name: Start Streamlit and verify health
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/super-streamlit.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -qi ok; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/super-streamlit.log
            kill "$pid" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8501/_stcore/health
          curl -fsS http://127.0.0.1:8501/ >/dev/null
          kill "$pid" || true

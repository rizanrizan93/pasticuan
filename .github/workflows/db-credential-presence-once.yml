name: Super DB credential presence once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-credential-presence-once.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ]; then echo 'SUPABASE_URL_PRESENT=true'; else echo 'SUPABASE_URL_PRESENT=false'; fi
          if [ -n "$SUPABASE_SECRET_KEY" ]; then echo 'SUPABASE_SECRET_KEY_PRESENT=true'; else echo 'SUPABASE_SECRET_KEY_PRESENT=false'; fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo 'SUPABASE_SERVICE_ROLE_KEY_PRESENT=true'; else echo 'SUPABASE_SERVICE_ROLE_KEY_PRESENT=false'; fi

name: Super live 400 cold smoke

on:
  push:
    branches: [main, fix/super-persistence-contract-20260814]
    paths:
      - '.github/workflows/live-400-smoke.yml'
      - 'fast_scan_engine.py'
      - 'scanner.py'
      - 'simple_focus.py'
      - 'persistence_contract_patch.py'
      - 'tests/test_v9_8_10_persistence_contract.py'
      - 'tests/test_narrative_coverage_precedence.py'
      - 'tests/test_ksei_valuation_provenance_alias.py'
      - 'tests/test_silent_confidence_output_contract.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  SCANNER_DATABASE_ENABLED: '0'
  SMOKE_RELEASE: 'v9.8.10-swing-production-gate'

jobs:
  cold-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install production and test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run evidence and persistence regressions
        run: |
          pytest -q tests/test_v9_8_10_persistence_contract.py tests/test_narrative_coverage_precedence.py tests/test_ksei_valuation_provenance_alias.py tests/test_silent_confidence_output_contract.py
      - name: Run 400-name cold production engine
        run: python tools/live_scan_400_smoke.py | tee /tmp/live-scan.log
      - name: Upload scanner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-live-400-cold-scan
          path: live_scan_output/
          if-no-files-found: warn

name: Super live 400 cold smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-400-smoke.yml'
      - 'tools/live_scan_400_smoke.py'
      - 'tools/idx_400_production_universe_2026-07.txt'
      - 'live_forward_evidence.py'
      - 'live_forward_runtime_patch.py'
      - 'future_fundamental_ui_patch.py'
      - 'evidence_governance.py'
      - 'official_evidence_bridge.py'
      - 'runtime_integrity_patch.py'
      - 'runtime_release.py'
      - 'fast_scan_engine.py'
      - 'scanner.py'
      - 'simple_focus.py'
      - 'release_contract.py'
      - 'resumable_app_engine.py'
      - 'scanner_database.py'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-400-smoke.yml'
      - 'tools/live_scan_400_smoke.py'
      - 'tools/idx_400_production_universe_2026-07.txt'
      - 'live_forward_evidence.py'
      - 'live_forward_runtime_patch.py'
      - 'future_fundamental_ui_patch.py'
      - 'evidence_governance.py'
      - 'official_evidence_bridge.py'
      - 'runtime_integrity_patch.py'
      - 'runtime_release.py'
      - 'fast_scan_engine.py'
      - 'scanner.py'
      - 'simple_focus.py'
      - 'release_contract.py'
      - 'resumable_app_engine.py'
      - 'scanner_database.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}
  SCANNER_DATABASE_ENABLED: '0'
  SMOKE_RELEASE: 'v9.8.21-future-evidence-status-ui'

jobs:
  cold-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install production and test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run full offline regression suite
        run: pytest -q
      - name: Live Future Fundamental network acquisition
        run: |
          python - <<'PY'
          from live_forward_evidence import collect_live_forward_evidence, collection_coverage
          names = ['MARK.JK','OMED.JK','TSPC.JK','MAHA.JK','ELSA.JK','TOTL.JK','DGWG.JK','AYAM.JK']
          companies = {
              'MARK.JK':'MARK DYNAMICS INDONESIA Tbk, PT',
              'OMED.JK':'JAYAMAS MEDICA INDUSTRI Tbk, PT',
              'TSPC.JK':'Tempo Scan Pacific Tbk, PT',
              'MAHA.JK':'MANDIRI HERINDO ADIPERKASA Tbk, PT',
              'ELSA.JK':'Elnusa Tbk, PT',
              'TOTL.JK':'Total Bangun Persada Tbk, PT',
              'DGWG.JK':'DELTA GIRI WACANA Tbk, PT',
              'AYAM.JK':'JANU PUTRA SEJAHTERA Tbk, PT',
          }
          frame = collect_live_forward_evidence(names, company_names=companies, lookback_days=180, max_workers=8, timeout=6.0)
          report = collection_coverage(frame, names)
          material = frame.loc[frame.get('forward_collection_state','').eq('MATERIAL_FORWARD_RESEARCH_EVIDENCE_FOUND')]
          print(frame[['ticker','company_name','forward_collection_state','forward_collection_coverage_pct']].to_string(index=False))
          print('LIVE_FORWARD_REPORT', report, 'MATERIAL_EVENTS', len(material), 'MATERIAL_TICKERS', material['ticker'].nunique() if len(material) else 0)
          if report['coverage_pct'] < 90.0:
              print(f"WARN_FORWARD_SOURCE_DEGRADED:{report}")
          if material.empty:
              print('WARN_FORWARD_NO_MATERIAL_EVIDENCE_IN_SMOKE_SAMPLE')
          PY
      - name: Run canonical 400-name cold production engine
        run: |
          set -o pipefail
          python tools/live_scan_400_smoke.py | tee /tmp/live-scan.log
      - name: Upload scanner outputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: super-live-400-cold-scan
          path: live_scan_output/
          if-no-files-found: warn

name: Phase 5.6 structured evidence backfill - Pasticuan

on:
  push:
    branches: [main]
    paths:
      - "shared_structured_fundamental_evidence.py"
      - "shared_structured_ownership_evidence.py"
      - "shared_company_evidence.py"
      - "tools/phase5_6_structured_evidence_backfill.py"
      - ".github/workflows/structured-evidence-backfill.yml"
      - "database/migration_v29_structured_fundamental_ownership.sql"
  workflow_dispatch:
    inputs:
      ownership_limit:
        description: Maximum issuer profiles to refresh
        required: false
        default: "800"
        type: string
      fundamental_gap_limit:
        description: Maximum structured financial gaps to refresh via Pluang
        required: false
        default: "250"
        type: string
  schedule:
    - cron: "30 18 * * 0"

permissions:
  contents: read

concurrency:
  group: phase5-6-structured-evidence-backfill
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
      SHARED_EVIDENCE_SUPABASE_URL: ${{ secrets.SHARED_EVIDENCE_SUPABASE_URL }}
      SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests==2.34.2 pandas==2.3.3
      - name: Run structured evidence backfill
        run: |
          python tools/phase5_6_structured_evidence_backfill.py             --ownership-limit "${{ inputs.ownership_limit || '800' }}"             --fundamental-gap-limit "${{ inputs.fundamental_gap_limit || '250' }}"             --workers 4

name: Super production hardening

on:
  push:
    branches: [codex/production-hardening-20260813]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply Super v9.8.7 production hardening') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-hardening-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic hardening
        run: python tools/apply_production_hardening.py
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile critical modules
        run: python -m py_compile app.py fast_scan_engine.py resumable_app_engine.py scanner_database.py scanner.py evidence_enrichment.py research_maintenance.py
      - name: Regression validation
        run: |
          python validation_v9_8_3_evidence_integrity.py
          python validation_v9_8_4_calibration_integrity.py
          python validation_v9_8_5_actionability_integrity.py
      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.py fast_scan_engine.py
          if git diff --cached --quiet; then
            echo 'No patch changes to commit'
          else
            git commit -m 'Apply Super v9.8.7 production hardening'
            git push origin HEAD:codex/production-hardening-20260813
          fi

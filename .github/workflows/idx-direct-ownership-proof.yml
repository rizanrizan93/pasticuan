name: Phase 5.6 IDX direct ownership profile proof

on:
  push:
    branches: ["phase5.6/idx-direct-ownership-profile"]
    paths:
      - ".github/workflows/idx-direct-ownership-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser-compatible HTTP client
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'curl-cffi>=0.13,<1'
      - name: Probe official IDX detailed profiles
        run: |
          python - <<'PY'
          import json
          from curl_cffi import requests

          base = 'https://www.idx.co.id/primary/ListedCompany/GetCompanyProfilesDetail'
          results = []
          for ticker in ('BBCA','MARK','OMED'):
              try:
                  response = requests.get(
                      base,
                      params={'emitenType':'s','kodeEmiten':ticker},
                      headers={'Accept':'application/json','Referer':'https://www.idx.co.id/id/perusahaan-tercatat/profil-perusahaan-tercatat/'},
                      timeout=20,
                      impersonate='chrome',
                  )
                  item = {'ticker': ticker, 'status': response.status_code}
                  if response.status_code == 200:
                      payload = response.json()
                      item['root_type'] = type(payload).__name__
                      if isinstance(payload, dict):
                          item['root_keys'] = sorted(payload.keys())[:30]
                          profiles = payload.get('Profiles') if isinstance(payload.get('Profiles'), list) else []
                          item['profiles'] = len(profiles)
                          first = profiles[0] if profiles and isinstance(profiles[0], dict) else {}
                          item['profile_ticker'] = first.get('KodeEmiten') or first.get('code')
                          holders = payload.get('PemegangSaham') if isinstance(payload.get('PemegangSaham'), list) else first.get('PemegangSaham') if isinstance(first.get('PemegangSaham'), list) else []
                          item['shareholders'] = len(holders)
                          item['shareholder_keys'] = sorted(holders[0].keys()) if holders and isinstance(holders[0], dict) else []
                  results.append(item)
              except Exception as exc:
                  results.append({'ticker':ticker,'error':f'{type(exc).__name__}: {str(exc)[:160]}'})
          print(json.dumps(results, sort_keys=True))
          if not all(item.get('status') == 200 and item.get('shareholders', 0) > 0 for item in results):
              raise SystemExit('direct IDX ownership profile proof incomplete')
          PY

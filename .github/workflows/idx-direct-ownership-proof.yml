name: Phase 5.6 direct ownership provider proof

on:
  push:
    branches: ["phase5.6/idx-direct-ownership-profile"]
    paths:
      - ".github/workflows/idx-direct-ownership-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install direct Yahoo client
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'yfinance>=0.2.65,<1' pandas
      - name: Probe Yahoo holder datasets for IDX tickers
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          import yfinance as yf

          results=[]
          for code in ('BBCA','MARK','OMED','ELSA','ANTM'):
              symbol=f'{code}.JK'
              item={'ticker':code}
              try:
                  t=yf.Ticker(symbol)
                  for attr in ('major_holders','institutional_holders','mutualfund_holders','insider_transactions'):
                      try:
                          value=getattr(t, attr)
                          if isinstance(value,pd.DataFrame):
                              item[attr]={'rows':int(len(value)),'columns':[str(c) for c in value.columns]}
                          elif value is None:
                              item[attr]={'rows':0,'columns':[]}
                          else:
                              item[attr]={'type':type(value).__name__}
                      except Exception as exc:
                          item[attr]={'error':f'{type(exc).__name__}: {str(exc)[:120]}'}
              except Exception as exc:
                  item['error']=f'{type(exc).__name__}: {str(exc)[:160]}'
              results.append(item)
          print(json.dumps(results,sort_keys=True))
          useful=sum(
              any(isinstance(v,dict) and int(v.get('rows',0) or 0)>0 for k,v in item.items() if k!='ticker')
              for item in results
          )
          if useful < 3:
              raise SystemExit(f'Yahoo ownership proof too sparse: useful={useful}/5')
          PY

name: Phase 5.6 Yahoo direct fundamental bootstrap

on:
  push:
    branches: [main]
    paths:
      - "tools/phase5_6_yahoo_direct_bootstrap.py"
      - ".github/workflows/yahoo-direct-fundamental-bootstrap.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum gap tickers to bootstrap
        required: false
        default: "160"
        type: string

permissions:
  contents: read

concurrency:
  group: phase5-6-yahoo-direct-fundamental-bootstrap
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHARED_EVIDENCE_SUPABASE_URL: ${{ secrets.SHARED_EVIDENCE_SUPABASE_URL }}
      SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir yfinance==0.2.66 pandas==2.3.3 requests==2.34.2 curl-cffi>=0.16,<1
      - name: Bootstrap Yahoo direct fundamentals
        run: python tools/phase5_6_yahoo_direct_bootstrap.py --limit "${{ inputs.limit || '160' }}" --sleep 0.75

name: Phase 5.6 bounded live validation gate — Pasticuan

on:
  workflow_dispatch:
    inputs:
      declared_cumulative_zapi_attempts:
        description: Previously consumed attempts in the release-controlled 0/12 ledger
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: phase5-6-bounded-live-validation-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PHASE56_BASELINE_SHA: 134a379e097d7de5475fb0eead253ca5152389f8

jobs:
  bounded-live-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout selected gate ref without push credentials
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the dedicated gate branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "gate/phase5-6-bounded-live-validation"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned harness dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir pandas==2.3.3 requests==2.34.2 pytest==8.4.2

      - name: Prove delta allowlist
        run: python tools/phase5_6_bounded_live_validation.py allowlist --baseline "${PHASE56_BASELINE_SHA}"

      - name: Run targeted fake-only harness tests
        run: pytest -q -p no:cacheprovider tests/test_phase5_6_bounded_live_validation.py

      - name: Execute bounded state machine
        env:
          ZAPI_KEY: ${{ secrets.ZAPI_KEY }}
          SHARED_EVIDENCE_SUPABASE_URL: ${{ secrets.SHARED_EVIDENCE_SUPABASE_URL }}
          SHARED_EVIDENCE_SUPABASE_SECRET_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SECRET_KEY }}
          SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SHARED_EVIDENCE_SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python tools/phase5_6_bounded_live_validation.py run
          --client PASTICUAN
          --declared-cumulative-attempts "${{ inputs.declared_cumulative_zapi_attempts }}"

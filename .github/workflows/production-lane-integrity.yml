name: Super production lane integrity

on:
  push:
    branches: [codex/production-lane-integrity-20260813]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message || '', 'Apply Super v9.8.9 production lane integrity') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-lane-integrity-20260813
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python tools/apply_production_lane_integrity.py
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Compile
        run: python -m py_compile app.py fast_scan_engine.py decision_overlay.py
      - name: Regression
        run: |
          pytest -q tests/test_v9_8_8_execution_plan_integrity.py tests/test_v9_8_9_production_lane_integrity.py
          python validation_v9_8_3_evidence_integrity.py
          python validation_v9_8_4_calibration_integrity.py
          python validation_v9_8_5_actionability_integrity.py
      - name: Streamlit smoke
        run: |
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/super-v989.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health | grep -qi ok; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then cat /tmp/super-v989.log; kill "$pid" || true; exit 1; fi
          kill "$pid" || true
      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.py fast_scan_engine.py decision_overlay.py
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Apply Super v9.8.9 production lane integrity'
            git push origin HEAD:codex/production-lane-integrity-20260813
          fi

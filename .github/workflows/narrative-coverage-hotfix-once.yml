name: Super narrative coverage hotfix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/narrative-coverage-hotfix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest
      - name: Apply narrative coverage patch
        run: python tools/apply_narrative_coverage_precedence_fix.py
      - name: Compile and regression
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile simple_focus.py
          python -m pytest -q tests/test_narrative_coverage_precedence.py tests/test_v9_8_10_persistence_contract.py
      - name: Commit production patch
        run: |
          if git diff --quiet -- simple_focus.py; then
            echo 'No production patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add simple_focus.py
          git commit -m 'Pair narrative scores with matching evidence coverage'
          git push origin HEAD:main
